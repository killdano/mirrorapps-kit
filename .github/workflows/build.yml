name: Build

# Builds the kit on its own and runs its unit tests, on every push to main
# and to the coder's claude/ branches. The apps build it again as part of
# themselves (it's a submodule there), so this catches kit-only breakage
# before a submodule bump does.

on:
  push:
    branches: ['main', 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :kit:assembleDebug :kit:testDebugUnitTest --stacktrace 2>&1 | tee build.log

      # Claude Code sessions can read check-run annotations but not Actions
      # logs, so compiler errors and failed tests are surfaced as one.
      - name: Report a failure
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          python3 - <<'PY'
          lines = open('build.log', errors='replace').read().splitlines()
          errs = [l for l in lines if l.startswith('e: ') or 'FAILED' in l][:25]
          if 'What went wrong:' in '\n'.join(lines):
              i = next(n for n, l in enumerate(lines) if 'What went wrong:' in l)
              errs += lines[i:i + 12]
          if not errs:
              errs = lines[-40:]
          msg = '%0A'.join(l.replace('%', '%25').replace('\r', '') for l in errs)
          print('::error title=Kit build failed::' + msg)
          PY
